# Reviewed real-hardware A/B dataset. All poses are expressed in elfin_base.
# Re-run the operator workspace and collision review after any target change.
base_frame: elfin_base
tool_frame: elfin_end_link

# Required positive TCP Y boundary in metres. This encodes y>0 and clearance
# from the X axis. Do not copy a guessed value from another installation.
y_safe_min_m: 0.05
y_safety_margin_m: 0.0

# Required positive joint interpolation step used for pre-execution FK checks.
workspace_fk_sample_max_joint_step_rad: 0.03

execution_mode: real
# Explicit operator authorization for the reviewed real-hardware dataset.
allow_real_motion: true
velocity_scaling: 0.2
acceleration_scaling: 0.2
repetitions: 3

# The real JointTrajectoryController and CAN FD hardware interface both use a
# 0.010 rad terminal tolerance. Add a bounded 0.001 rad observation guard band
# for the 100 Hz published state; every measured start delta remains recorded.
# This still rejects the previously observed 0.01684 rad alternate-IK solution.
q0_tolerance_rad: 0.011
# Independent stationarity criterion over the complete settle window. A stable
# q0 mismatch receives exactly one MoveJ retry; continued motion never does.
q0_motion_span_tolerance_rad: 0.001
q0_settle_sec: 0.5
q0_wait_timeout_sec: 15.0
supervisor_wait_timeout_sec: 15.0
action_timeout_sec: 60.0
metrics_timeout_sec: 2.0
joint_state_timeout_sec: 0.5
tf_lookup_timeout_sec: 0.05
safety_poll_period_sec: 0.02

auto_reset_to_start: true
# The initial reset uses MovePose to establish the safe Cartesian start and
# capture its measured six-joint q0. Every later reset uses MoveJ to return to
# exactly that q0, avoiding a different IK solution for the same Cartesian pose.
reset_algorithm: move_j

start_pose:
  frame_id: elfin_base
  position: [-0.104, 0.443, 0.228]
  orientation: [0.786043627, 0.618034302, -0.005000278, 0.012000666]

# Freeze this list before collecting results. Use identical targets for A/B.
